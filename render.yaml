
services:
  - type: web
    name: agatha-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    #disk:
      name: agatha-data
      mountPath: /tmp/var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AGATHA_DATA_DIR
        value: /tmp/var/data
      - key: AGATHA_CLIP_DIR
        value: /tmp/var/data/creator_output
      - key: AGATHA_HOSTED_MODE
        value: "true"
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_PORT
        value: "10001"
      - key: AGATHA_OWNER_NAME
        value: Creator
      - key: AGATHA_OWNER_IDENTIFIER
        sync: false
      - key: AGATHA_OWNER_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
